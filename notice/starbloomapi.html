<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>∠(ᗜ˰ᗜ)＞ 页面不见了喵</title>
    <meta name="theme-color" content="#0a0a0a">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080a14;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 60px;
            padding-bottom: 40px;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 
                0 0 4px rgba(102, 126, 234, 0.8),
                0 0 8px rgba(118, 75, 162, 0.6),
                0 0 16px rgba(102, 126, 234, 0.4),
                0 0 32px rgba(118, 75, 162, 0.3);
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.4rem;
            margin-top: 30px;
            margin-bottom: 12px;
            color: #ffffff;
            text-shadow:
                0 0 3px rgba(102, 126, 234, 0.9),
                0 0 6px rgba(118, 75, 162, 0.7),
                0 0 12px rgba(102, 126, 234, 0.5);
            border-bottom: 1px solid rgba(100, 150, 255, 0.3);
            padding-bottom: 8px;
        }

        h3 {
            font-size: 1.1rem;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow:
                0 0 2px rgba(102, 126, 234, 0.8),
                0 0 4px rgba(118, 75, 162, 0.6);
        }

        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(13, 22, 66, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(100, 150, 255, 0.2);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .home-btn {
            color: #aabbff;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .home-btn:hover {
            color: #ffffff;
            background: rgba(100, 150, 255, 0.15);
        }

        .subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #8888aa;
            margin-bottom: 30px;
        }

        .section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(100, 150, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(8px);
        }

        .section p {
            line-height: 1.8;
            color: #e0e0ff;
            margin-bottom: 10px;
        }

        .section .note {
            color: #ffaa88;
            font-size: 0.9rem;
            background: rgba(255, 100, 50, 0.08);
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 3px solid rgba(255, 100, 50, 0.5);
            margin: 10px 0;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .watermark {
            position: fixed;
            bottom: 15px;
            right: 15px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 4px;
            font-size: 11px;
            color: rgba(160, 160, 255, 0.6);
            pointer-events: none;
            z-index: 10000;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            h2 { font-size: 1.2rem; }
            .check-grid { grid-template-columns: 1fr; }
            .container { margin-top: 50px; }
        }
    </style>
</head>
<body>
    <nav class="toolbar">
        <a href="../index.html" target="_self" class="home-btn">✦返回主页✦</a>
    </nav>

    <div class="stars" id="stars"></div>

    <div class="container">

        <div style="text-align: center;">
            <img src="whatthe.png" width="128" height="96">
        </div>

        <h1>✦ 咦？这个页面怎么没了喵？ ✦</h1>
        <div class="subtitle">通知</div>
        <p>因最新版 SAPI (2.11.0-beta.1.26.50-preview.27) 锁定了各大内置类的属性跨脚本改变属性(如在main.js内的player.cps = cps在另外一个脚本为只读)，为了适配最新版, StarBloomAPI v3 正在努力开发中，期间下载页面将被隔离，请见谅！</p>
    </div>

        <div class="watermark">By NyaCrasin</div>

        <script>

            function createStars() {
                const container = document.getElementById('stars');
                for (let i = 0; i < 100; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 3 + 's';
                    container.appendChild(star);
                }
            }

            createStars();
        </script>
</body>
</html>
